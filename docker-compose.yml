services:
  app:
    build: .
    depends_on:
      - electrs
      - bitcoind
    environment:
      ELECTRUM_HIDDEN_SERVICE: "notyetset.onion"
      ELECTRUM_LOCAL_SERVICE: "localhost"
      ELECTRUM_PORT: "50001"
      ELECTRS_HOST: electrs
      ELECTRS_PORT: "50001"
      ELECTRS_METRICS_PORT: "4224"
      BITCOIN_HOST: bitcoind
      RPC_PORT: "18443"
      RPC_USER: umbrel
      RPC_PASSWORD: umbrel
    ports:
      - "3006:3006"

    restart: on-failure

  electrs:
    image: getumbrel/electrs:v0.11.1@sha256:f1d5d4e431d39e0aaa0697014d2852880183e350ffcad612edb87183f0c11b25
    depends_on:
      - bitcoind
    environment:
      ELECTRS_LOG_FILTERS: INFO
      ELECTRS_NETWORK: regtest
      ELECTRS_DAEMON_RPC_ADDR: bitcoind:18443
      ELECTRS_DAEMON_P2P_ADDR: bitcoind:18444
      ELECTRS_ELECTRUM_RPC_ADDR: 0.0.0.0:50001
      ELECTRS_MONITORING_ADDR: 0.0.0.0:4224
      ELECTRS_SERVER_BANNER: Umbrel Electrs
      ELECTRS_COOKIE_FILE: /bitcoin/regtest/.cookie
      ELECTRS_DB_DIR: /data/db
    volumes:
      - ./data/bitcoin:/bitcoin:ro
      - ./data/electrs:/data
    ports:
      - "50001:50001"
    restart: on-failure

  bitcoind:
    image: bitcoin/bitcoin:29.0
    command:
      - -regtest=1
      - -server=1
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -rpcuser=umbrel
      - -rpcpassword=umbrel
      - -rpcport=18443
      - -port=18444
      - -fallbackfee=0.0002
    volumes:
      - ./data/bitcoin:/home/bitcoin/.bitcoin
    restart: on-failure
